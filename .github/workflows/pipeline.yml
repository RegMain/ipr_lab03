name: Pipeline

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest # runner - Settings -> Actions -> Runners
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # git clone + git checkout

      - name: HTML lint
        run: |
          npm install -g htmlhint
          htmlhint index.html

      - name: Build Docker image
        run: docker build -t lab3:ci .

      - name: Smoke test container
        run: |
          docker run -d --name l3test -p 8080:80 lab3:ci
          for i in $(seq 1 7); do
            if curl -sf http://localhost:8080 > /tmp/page.html; then break; fi
            sleep 1
          done
          grep -q "Харьков Иван" /tmp/page.html
          echo "OK"
      
      - name: Cleanup
        if: always()
        run: docker rm -f l3test || true
        
  release:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
    
